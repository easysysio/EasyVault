# EasyVault documentation site — https://easyvault.easysys.io
#
# Same design as easysys.io. The landing page (docs/index.md) is drawn with the
# EasySYS `es-*` components copied into stylesheets/easysys.css; the
# documentation pages keep Material's navigation and search, themed with the
# same tokens in stylesheets/easyvault.css. The pages live beside the code they
# describe, so a feature and its documentation land in one commit.
#
# Build:   pip install -r docs-requirements.txt && mkdocs serve
# Deploy:  ./deploy-docs.sh   (on the host that serves the site)

site_name: EasyVault
site_url: https://easyvault.easysys.io/
site_description: A self-hosted, HashiCorp Vault–compatible secrets manager with envelope encryption at its core.
repo_url: https://github.com/easysysio/EasyVault
repo_name: easysysio/EasyVault
copyright: MIT licensed · part of the EasySYS suite

nav:
  - Home: index.md
  - Documentation:
      - Installation: install.md
      - Initialize & unseal: unseal.md
      - Security model: security.md
      - Secrets & access: secrets.md
      - Operations: operations.md
      - API reference: reference.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/easysysio/EasyVault
    - icon: fontawesome/solid/globe
      link: https://easysys.io
    - icon: fontawesome/brands/discord
      link: https://discord.gg/easysys

extra_css:
  # Bump ?v= whenever a stylesheet changes so browsers fetch the new file
  # instead of serving a cached copy.
  - stylesheets/easysys.css?v=1
  - stylesheets/easyvault.css?v=1
